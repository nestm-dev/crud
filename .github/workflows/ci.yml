name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
        env: { PG_SKIP: "1" }

  postgres:
    name: postgres (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lockfile pins the catalog versions (Nest 12.5.1, TypeORM 1.1.3); each lane
          # asserts them so a stale lockfile cannot silently test something else.
          - lane: pg16
            image: postgres:16-alpine
          - lane: "pg18 · nest 12.5 · typeorm 1.1.3"
            image: postgres:18-alpine
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: nestm_crud
          POSTGRES_USER: nestm
          POSTGRES_PASSWORD: nestm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nestm -d nestm_crud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Assert framework, ORM, and server versions
        env:
          PG_URL: postgres://nestm:nestm@localhost:5432/nestm_crud
        # Read the manifests from disk: package `exports` maps (typeorm's `./*`) can rewrite
        # `<name>/package.json` specifiers, so require() is not a reliable version probe.
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import pg from "pg";
            const expected = { "@nestjs/common": /^12\.5\./, "@nestjs/core": /^12\.5\./, typeorm: /^1\.1\.3$/ };
            for (const [name, pattern] of Object.entries(expected)) {
              const { version } = JSON.parse(readFileSync(`node_modules/${name}/package.json`, "utf8"));
              if (!pattern.test(version)) throw new Error(`${name} resolved ${version}`);
              console.log(`${name} ${version}`);
            }
            const client = new pg.Client({ connectionString: process.env.PG_URL });
            await client.connect();
            const { rows } = await client.query("show server_version");
            console.log(`postgres ${rows[0].server_version}`);
            await client.end();'
      - run: pnpm run test:postgres
        env:
          PG_URL: postgres://nestm:nestm@localhost:5432/nestm_crud

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [crud, crud-memory, crud-typeorm, crud-drizzle, crud-prisma]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "...@nestm/${{ matrix.package }}" run build
      - run: pnpm exec publint --strict "packages/${{ matrix.package }}"
      - run: pnpm exec attw --pack "packages/${{ matrix.package }}" --profile esm-only

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:consumer

  nest-next-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --recursive up "@nestjs/common@next" "@nestjs/core@next" "@nestjs/swagger@next"
      - run: pnpm run check
      - run: pnpm run test
        env: { PG_SKIP: "1" }
