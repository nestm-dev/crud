name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
        env: { PG_SKIP: "1" }

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nestm_crud
          POSTGRES_USER: nestm
          POSTGRES_PASSWORD: nestm
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nestm -d nestm_crud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:postgres
        env:
          PG_URL: postgres://nestm:nestm@localhost:5432/nestm_crud

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [crud, crud-memory, crud-typeorm, crud-drizzle, crud-prisma]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "...@nestm/${{ matrix.package }}" run build
      - run: pnpm exec publint --strict "packages/${{ matrix.package }}"
      - run: pnpm exec attw --pack "packages/${{ matrix.package }}" --profile esm-only

  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:consumer

  nest-next-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --recursive up "@nestjs/common@next" "@nestjs/core@next" "@nestjs/swagger@next"
      - run: pnpm run check
      - run: pnpm run test
        env: { PG_SKIP: "1" }
