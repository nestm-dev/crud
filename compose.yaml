name: nestm-crud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nestm_crud
      POSTGRES_USER: nestm
      POSTGRES_PASSWORD: nestm
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestm -d nestm_crud"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
