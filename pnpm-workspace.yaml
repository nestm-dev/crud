packages:
  - "packages/*"
  - "examples/*"

# Keep peer-qualified ORM types on one physical instance in workspace tests.
overrides:
  "@types/pg": "8.20.4"
  pg: "8.22.0"

peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12"
    "@nestjs/core": "12"
    "@nestjs/platform-express": "12"
    "@nestjs/platform-fastify": "12"
    "@nestjs/swagger": "12"

allowBuilds:
  "@nestjs/core": false
  "@prisma/engines": false
  "prisma": false
  esbuild: false
  "@scarf/scarf": false

provenance: true
