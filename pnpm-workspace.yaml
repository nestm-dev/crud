packages:
  - "packages/*"
  - "examples/*"

# Framework and ORM peers shared by the root and every package. Each workspace package
# auto-installs its own peers, so without the overrides below a Dependabot bump of a root
# devDependency left the packages on the previous version: tests then loaded two copies of
# @nestjs/core (StandardSchemaModule could not resolve Reflector) or of typeorm (private-member
# type errors). The catalog is the single version source; the overrides force every importer,
# including auto-installed peers, onto it.
catalog:
  "@nestjs/common": 12.5.1
  "@nestjs/core": 12.5.1
  "@nestjs/swagger": 12.1.2
  "@prisma/client": 7.10.0
  drizzle-orm: 0.45.2
  typeorm: 1.1.3

overrides:
  "@types/pg": "8.23.1"
  pg: "8.23.0"
  "@nestjs/common": "catalog:"
  "@nestjs/core": "catalog:"
  "@nestjs/swagger": "catalog:"
  "@prisma/client": "catalog:"
  drizzle-orm: "catalog:"
  typeorm: "catalog:"

allowBuilds:
  "@nestjs/core": false
  "@prisma/engines": false
  "prisma": false
  esbuild: false
  "@scarf/scarf": false

provenance: true

minimumReleaseAgeExclude:
  - "@nestm/standard-schema@0.1.0-alpha.9"
  - "@types/node@26.4.0"
