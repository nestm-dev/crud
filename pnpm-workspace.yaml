packages:
  - "packages/*"
  - "examples/*"

peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12"
    "@nestjs/core": "12"
    "@nestjs/platform-express": "12"
    "@nestjs/platform-fastify": "12"
    "@nestjs/swagger": "12"

allowBuilds:
  "@nestjs/core": false
  "@prisma/engines": false
  "prisma": false
  esbuild: false
  "@scarf/scarf": false

provenance: true
