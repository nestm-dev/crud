packages:
  - "packages/*"
  - "examples/*"

# Keep peer-qualified ORM types on one physical instance in workspace tests.
overrides:
  "@types/pg": "8.23.1"
  pg: "8.23.0"

allowBuilds:
  "@nestjs/core": false
  "@prisma/engines": false
  "prisma": false
  esbuild: false
  "@scarf/scarf": false

provenance: true

minimumReleaseAgeExclude:
  - "@nestm/standard-schema@0.1.0-alpha.9"
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/mapped-types@12.0.0"
  - "@nestjs/platform-express@12.0.1"
  - "@nestjs/platform-fastify@12.0.1"
  - "@nestjs/swagger@12.0.0"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"
